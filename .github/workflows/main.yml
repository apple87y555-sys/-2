name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project if exists
      run: |
        if ls *.zip >/dev/null 2>&1; then
          unzip -o *.zip
        fi

    - name: Build with Gradle
      run: |
        # البحث عن ملف gradlew وتجهيزه
        GRADLEW_PATH=$(find . -name gradlew | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        else
          # في حال عدم وجود gradlew سنعتمد على gradle النظام
          BUILD_DIR=$(find . -name "build.gradle*" -exec dirname {} + | head -n 1)
          cd "$BUILD_DIR"
          gradle assembleDebug --no-daemon
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: "**/build/outputs/apk/debug/*.apk"
