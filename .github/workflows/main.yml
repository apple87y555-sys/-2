name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Prepare Files
      run: |
        # فك الضغط إذا كان هناك ملف ZIP، وإلا انقل الملفات لمجلد عمل
        if ls *.zip >/dev/null 2>&1; then
           unzip '*.zip' -d project_source
        else
           mkdir project_source
           mv * project_source/ || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      run: |
        # البحث عن ملف التشغيل في أي مكان داخل المجلد وتشغيله
        GRADLEW_PATH=$(find . -name gradlew | head -n 1)
        chmod +x "$GRADLEW_PATH"
        "$GRADLEW_PATH" assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        # البحث عن أي ملف APK تم إنتاجه في أي مكان
        path: "**/app/build/outputs/apk/debug/*.apk"
