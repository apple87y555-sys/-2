name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project if exists
      run: |
        if ls *.zip >/dev/null 2>&1; then
          unzip -o *.zip
        fi

    - name: Setup Gradle Wrapper and Build
      run: |
        # البحث عن المجلد الذي يحتوي على build.gradle أو app
        BUILD_DIR=$(find . -name "build.gradle*" -exec dirname {} + | head -n 1)
        cd "$BUILD_DIR"
        
        # تثبيت gradle وتوليد ملف gradlew تلقائياً إذا كان مفقوداً
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: "**/build/outputs/apk/debug/*.apk"
